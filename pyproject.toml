[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mate-api"
version = "3.0.0a1"
description = "Unofficial Leapmotor Cloud API V3 client and B10 command contracts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["tzdata>=2024.1; platform_system == 'Windows'"]
classifiers = ["Development Status :: 2 - Pre-Alpha"]

[project.optional-dependencies]
certificates = ["cryptography>=42"]

[tool.setuptools.packages.find]
where = ["."]
include = ["leapmotor_cloud*"]

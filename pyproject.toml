[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mate-api"
version = "0.1.0a8"
description = "Unofficial Leapmotor cloud client with V3 commands and B10 command contracts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["tzdata>=2024.1; platform_system == 'Windows'"]
classifiers = ["Development Status :: 2 - Pre-Alpha"]

[project.optional-dependencies]
certificates = ["cryptography>=42"]

[tool.setuptools.packages.find]
where = ["."]
include = ["leapmotor_cloud*"]
